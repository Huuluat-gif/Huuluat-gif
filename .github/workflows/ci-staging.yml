name: Lowf Library CI & Cloudflare Staging

on:
  push:
    branches:
      - migration/cloudflare
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - migration/cloudflare
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to private Cloudflare Workers Staging'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# Production deployment is intentionally NEVER auto-triggered from CI pushes.
# Production cutover requires explicit owner approval via a separate manual workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_and_security:
    name: Typecheck, Build & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Security dependency audit (high/critical)
        run: npm audit --audit-level=high || true

      - name: Verify no secrets or large binaries committed
        run: |
          if git ls-files | grep -iE '\.(pdf|epub|env|pem|key)$'; then
            echo "ERROR: Prohibited book binary or secret file found in git tree!"
            exit 1
          fi
          echo "Repository hygiene check passed."

      - name: Next.js production build check
        run: npm run build
        env:
          LOWF_ENV: staging
          NEXT_TELEMETRY_DISABLED: '1'

  deploy_cloudflare_staging:
    name: Deploy Private Cloudflare Staging (vinext / Workers)
    needs: quality_and_security
    if: github.ref == 'refs/heads/migration/cloudflare' && (github.event_name == 'push' || github.event.inputs.deploy_staging == 'true')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Cloudflare deploy secrets
        id: check_cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Environment 'staging' to enable automated Cloudflare Workers staging deploys."
          fi

      - name: Build & deploy Cloudflare Workers Staging (vinext)
        if: steps.check_cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LOWF_ENV: staging
        run: |
          npx --yes vinext build
          npx --yes wrangler deploy --env staging
